<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-labelledby="t d">
  <title id="t">Wilhelm for Earl</title>
  <desc id="d">Typographic campaign placard: a crimson field with gold rules, a raven over a fjord at dawn, the headline Wilhelm for Earl and the slogan A longship in every fjord.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2430"/>
      <stop offset="0.55" stop-color="#3a3138"/>
      <stop offset="1" stop-color="#c9a24a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3a48"/>
      <stop offset="1" stop-color="#10161d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d78a"/>
      <stop offset="1" stop-color="#c9a24a"/>
    </linearGradient>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <circle cx="1" cy="1" r=".5" fill="#000" opacity=".12"/>
      <circle cx="3" cy="3" r=".5" fill="#fff" opacity=".05"/>
    </pattern>
  </defs>

  <!-- field -->
  <rect width="600" height="800" fill="#8a1d1d"/>
  <rect width="600" height="800" fill="url(#grain)"/>
  <rect x="22" y="22" width="556" height="756" fill="none" stroke="#c9a24a" stroke-width="3"/>
  <rect x="32" y="32" width="536" height="736" fill="none" stroke="#c9a24a" stroke-width="1" opacity=".7"/>

  <!-- the fjord at dawn -->
  <rect x="52" y="52" width="496" height="330" fill="url(#sky)"/>
  <circle cx="300" cy="300" r="46" fill="#f1d78a" opacity=".9"/>
  <path d="M52 250 L130 170 L190 230 L250 150 L320 240 L390 160 L450 220 L548 140 L548 300 L52 300 Z" fill="#1a2430"/>
  <path d="M52 268 L120 212 L185 262 L245 196 L320 270 L395 206 L450 256 L548 190 L548 320 L52 320 Z" fill="#10161d"/>
  <rect x="52" y="300" width="496" height="82" fill="url(#water)"/>
  <!-- longships -->
  <g fill="#0b0f14">
    <path d="M150 352 q10 -16 28 -18 l0 -6 l4 0 l0 6 q60 8 110 0 l0 -6 l4 0 l0 6 q16 2 26 18 q-20 10 -86 10 q-66 0 -86 -10 Z"/>
    <path d="M378 344 q6 -10 18 -12 l0 -4 l3 0 l0 4 q40 6 72 0 l0 -4 l3 0 l0 4 q10 2 16 12 q-14 7 -56 7 q-42 0 -56 -7 Z"/>
    <rect x="229" y="316" width="3" height="20"/>
    <rect x="430" y="321" width="2" height="14"/>
  </g>
  <g stroke="#c9a24a" stroke-width="1" opacity=".55">
    <line x1="52" y1="342" x2="548" y2="342"/>
    <line x1="52" y1="366" x2="548" y2="366"/>
  </g>
  <!-- raven -->
  <path d="M96 120 q14 -16 30 -8 q4 -6 12 -4 l6 10 q10 4 20 0 q-8 12 -22 10 q-6 14 -24 14 q-10 0 -18 -8 q-6 6 -16 4 q10 -6 12 -18 Z" fill="#0b0f14"/>
  <circle cx="134" cy="112" r="1.6" fill="#f1d78a"/>
  <rect x="52" y="52" width="496" height="330" fill="none" stroke="#c9a24a" stroke-width="2"/>

  <!-- headline -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="url(#gold)">
    <text x="300" y="470" font-size="84" font-weight="700" letter-spacing="4">WILHELM</text>
    <text x="300" y="540" font-size="54" letter-spacing="10">FOR EARL</text>
  </g>
  <line x1="120" y1="572" x2="480" y2="572" stroke="#c9a24a" stroke-width="2"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#e8d9b5">
    <text x="300" y="620" font-size="27" font-style="italic">A longship in every fjord.</text>
    <text x="300" y="664" font-size="15" letter-spacing="4" fill="#f1d78a">CANDIDATE FOR EARL · THE WESTERN FJORDS</text>
  </g>
  <line x1="120" y1="696" x2="480" y2="696" stroke="#c9a24a" stroke-width="1" opacity=".7"/>
  <text x="300" y="740" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="3" text-anchor="middle" fill="#f1d78a">iamwilhelm.com</text>
</svg>
